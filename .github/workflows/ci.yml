name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - name: Sync pinned curricula revision
        run: npm run content:sync
      - run: npm test
      - run: npm run build
        env:
          CONTENT_STRICT: '1'
      - name: Install browser for e2e tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: '1'
      - name: Build without curricula content (planned-only fallback)
        run: rm -rf .cache && npm run build
